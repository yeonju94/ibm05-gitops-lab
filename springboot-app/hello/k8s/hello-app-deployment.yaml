apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-app
  namespace: hello-app
spec:
  replicas: 2
  selector:
    matchLabels:
    # template의 pod app와 라벨이 일치해야 함
      app: hello-app
  template:
    metadata:
      labels:
      # 서비스의 label과 일치(연결고리)
        app: hello-app
    spec:
      containers:
      - name: hello-app
        # Kustomize가 이 이미지 태그를 관리
        # 본인의 도커 허브 사용자 이름으로 변경
        image: yeonju94/hello-app:latest
        ports:
        - containerPort: 8080

        
    